name:                cosmic-expansion
version:             0.1.0.0
github:              "karakuri-strategist/cosmic-expansion"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2025 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/complexity#readme>

dependencies:
- base >= 4.7 && < 5
- gloss >= 1.13.2.2 && < 1.14.0.0
- random >= 1.2.1.0 && < 1.3.0.0
- vector >= 0.13.2.0 && < 0.14.0.0

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -rtsopts

library:
  source-dirs: src

executables:
  cosmic-expansion-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    build-defaults:
      ghc-options:
      - -with-rtsopts=-A64M
      - -with-rtsopts=-I0.1
    dependencies:
    - cosmic-expansion

tests:
  cosmic-expansion-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cosmic-expansion
